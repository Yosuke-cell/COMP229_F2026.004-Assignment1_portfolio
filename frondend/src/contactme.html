<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact me</title>
    <link rel="stylesheet" href="contactme.css">
</head>
<body>
    <div id = "nav">
      <span id = "nav-title">My Portfolio</span>
      <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="about.html">About me</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="references.html">References</a></li>
        <li><a href="contactme.html">Contact me</a></li>
      </ul>
    </div>
    <h1>Contact me</h1>
    <p id = "intro">Send me a message and I will get back to you.</p>
    <form id = "contact-form" class = "box">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label for="phone">Phone number</label>
      <input type="tel" id="phone" name="phone" placeholder="123-456-7890">

      <label for="description">Description</label>
      <textarea id="description" name="description" rows="6" placeholder="Tell me about your project or question" required></textarea>

      <button type="submit" class = "box-button">Send</button>
      <p id = "message"></p>
    </form>

    <script>
      document.getElementById("contact-form").addEventListener("submit", function (event) {
        event.preventDefault();
        var name = document.getElementById("name").value;
        document.getElementById("message").textContent = "Thank you, " + name + "! Your message has been received.";
        this.reset();
      });
    </script>
</body>
</html>
